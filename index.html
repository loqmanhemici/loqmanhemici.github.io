<style>
:root{
  --blue:#1C35F0; --navy:#0B1440; --lime:#D6FF3D; --off:#F5F7FF; --white:#FFFFFF;
  --mut:#545F82; --line:#DCE1F5;
  --ar:'Alexandria','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic','Manrope',system-ui,sans-serif;
  --en:'Manrope','IBM Plex Sans Arabic',system-ui,sans-serif;
  --wrap:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--white);color:var(--navy);font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:var(--en)}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{width:min(var(--wrap),100% - 40px);margin-inline:auto}
h1,h2,h3{font-family:var(--ar);line-height:1.25;margin:0}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{font-family:var(--en)}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:6px}

/* frame signature */
.vf{position:relative;display:inline-block;padding:.05em .28em}
.vf::before,.vf::after,.vf>i::before,.vf>i::after{content:"";position:absolute;width:.32em;height:.32em;border:.07em solid var(--lime)}
.vf::before{top:0;inset-inline-start:0;border-inline-end:0;border-bottom:0}
.vf::after{top:0;inset-inline-end:0;border-inline-start:0;border-bottom:0}
.vf>i::before{bottom:0;inset-inline-start:0;border-inline-end:0;border-top:0}
.vf>i::after{bottom:0;inset-inline-end:0;border-inline-start:0;border-top:0}
.vf.blue::before,.vf.blue::after,.vf.blue>i::before,.vf.blue>i::after{border-color:var(--blue)}

/* nav */
.nav{position:fixed;inset:0 0 auto;z-index:20;padding-top:env(safe-area-inset-top,0px);transition:background .25s}
.nav.solid{background:rgba(11,20,64,.86);backdrop-filter:blur(12px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-family:var(--en);font-weight:800;font-size:18px}
.brand img{width:36px;height:36px;border-radius:50%;border:2px solid var(--lime)}
.brand b{color:var(--lime)}
.links{display:flex;gap:26px;align-items:center}
.links a{color:#DDE3FF;text-decoration:none;font-weight:600;font-size:15px}
.links a:hover{color:#fff}
.lang{border:1.5px solid var(--lime);background:transparent;color:#fff;border-radius:999px;padding:6px 16px;font-family:var(--en);font-weight:700;cursor:pointer}
@media (max-width:760px){.links a{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:150px 0 120px;
  background:radial-gradient(circle at 70% 30%,#6F87FF 0,transparent 55%),linear-gradient(180deg,#1C35F0 0%,#1529C2 60%,#0B1440 100%)}
html[dir="ltr"] .hero{background:radial-gradient(circle at 30% 30%,#6F87FF 0,transparent 55%),linear-gradient(180deg,#1C35F0 0%,#1529C2 60%,#0B1440 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(180deg,#000 40%,transparent)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:48px;align-items:center}
.word{font-family:var(--en);font-weight:800;font-size:clamp(56px,10vw,128px);line-height:1;letter-spacing:-.02em;direction:ltr;text-align:start;margin-bottom:28px}
html[dir="rtl"] .word{text-align:right}
.word .vf{color:var(--lime)}
.hero h1{font-size:clamp(26px,3.4vw,40px);font-weight:800}
.hero p.lead{color:#DDE3FF;font-size:clamp(17px,1.6vw,20px);max-width:56ch;margin:18px 0 32px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;font-weight:700;text-decoration:none;font-size:16px;border:2px solid transparent}
.btn.primary{background:var(--lime);color:var(--navy)}
.btn.ghost{border-color:rgba(255,255,255,.5);color:#fff}
.btn.ghost:hover{border-color:#fff}
.avatar{justify-self:center;position:relative;width:min(340px,80vw);aspect-ratio:1}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:44px;border:6px solid var(--lime);box-shadow:0 40px 80px rgba(6,10,40,.45)}
.avatar .tag{position:absolute;inset-block-end:-18px;inset-inline-start:-18px;background:#fff;color:var(--navy);border-radius:18px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:0 16px 40px rgba(6,10,40,.3)}
.avatar .tag span{color:var(--blue);font-family:var(--en);font-weight:800}
.facts{display:flex;flex-wrap:wrap;gap:36px;margin-top:56px;padding-top:28px;border-top:1px solid rgba(255,255,255,.2)}
.facts div{font-size:15px;color:#DDE3FF}
.facts b{display:block;font-family:var(--en);font-size:40px;line-height:1.1;color:#fff}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.avatar{order:-1;width:200px}}

/* sections */
section{padding:110px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:44px;flex-wrap:wrap}
.head h2{font-size:clamp(32px,4.4vw,52px);font-weight:800}
.head p{color:var(--mut);max-width:48ch;margin:10px 0 0}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:8px 18px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* work grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media (max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{all:unset;cursor:pointer;display:block;border-radius:24px;overflow:hidden;background:var(--off);position:relative}
.card .img{aspect-ratio:3/4;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover img{transform:scale(1.04)}
.card .meta{padding:18px 22px 22px}
.card h3{font-size:22px;font-weight:800}
.card .type{color:var(--blue);font-weight:600;font-size:15px}
.card .count{position:absolute;top:14px;inset-inline-end:14px;background:var(--navy);color:#fff;font-family:var(--en);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.card[hidden]{display:none}

/* services */
.services{background:var(--off)}
.svc{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:2px solid var(--navy)}
.svc div{padding:30px 0;border-bottom:1px solid var(--line)}
.svc div:nth-child(odd){padding-inline-end:40px}
.svc div:nth-child(even){padding-inline-start:40px;border-inline-start:1px solid var(--line)}
.svc h3{font-size:24px;font-weight:800;margin-bottom:6px}
.svc p{margin:0;color:var(--mut)}
@media (max-width:700px){.svc{grid-template-columns:1fr}.svc div:nth-child(n){padding-inline:0;border-inline-start:0}}

/* about */
.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:64px}
@media (max-width:860px){.about .wrap{grid-template-columns:1fr}}
.about p.bio{font-size:19px;margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 28px}
.chips span{border-radius:12px;padding:8px 16px;font-family:var(--en);font-weight:700;font-size:15px;background:var(--navy);color:#fff}
.chips.ai span{background:var(--lime);color:var(--navy)}
.about h3{font-size:18px;color:var(--blue);font-weight:700}
.langs div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.langs span{color:var(--mut)}
.clients{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.clients span{border:1.5px solid var(--blue);border-radius:999px;padding:6px 16px;font-weight:600}

/* contact */
.contact{background:linear-gradient(180deg,#1C35F0,#0B1440);color:#fff;text-align:center}
.contact h2{font-size:clamp(34px,5vw,64px);font-weight:800}
.contact h2 .vf{color:var(--lime)}
.contact p{color:#DDE3FF;margin:16px auto 36px;max-width:52ch}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px;text-align:start}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.cards{grid-template-columns:1fr}}
.cards a{display:block;text-decoration:none;padding:20px 22px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}
.cards a:hover{background:rgba(255,255,255,.14)}
.cards small{display:block;color:var(--lime);font-family:var(--en);font-weight:700;font-size:13px}
.cards strong{font-family:var(--en);font-size:17px;word-break:break-all;direction:ltr;unicode-bidi:isolate}
footer{background:#0B1440;color:#9AA6D8;text-align:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));font-size:14px;border-top:1px solid rgba(255,255,255,.08)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(6,10,40,.94);display:none;flex-direction:column}
.lb.open{display:flex}
.lb header{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 24px 16px;color:#fff;gap:16px}
.lb header h3{font-size:20px}
.lb header p{margin:0;color:#B8C2F0;font-size:15px}
.lb .x{background:var(--lime);color:var(--navy);border:0;border-radius:999px;width:44px;height:44px;font-size:22px;font-weight:800;cursor:pointer;flex:none}
.lb .strip{flex:1;display:flex;gap:20px;overflow-x:auto;padding:8px 24px calc(28px + env(safe-area-inset-bottom,0px));scroll-snap-type:x mandatory;align-items:center}
.lb .strip img{height:min(78vh,900px);width:auto;max-width:88vw;object-fit:contain;border-radius:16px;scroll-snap-align:center;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const SVC={ar:[['الهوية البصرية والشعارات','شعار، ألوان، خطوط، ودليل استخدام يخلي علامتك ثابتة في كل مكان.'],['أنظمة السوشيال ميديا','قوالب وشبكة إنستغرام متناسقة، وبوستات وستوريات وكاروسيل جاهزة للنشر.'],['الحملات والإطلاق','حملات منتجات وعروض وإطلاقات بتسلسل يشد الانتباه ويوصل للبيع.'],['موشن وعروض تقديمية','ريلز موشن 2D وفيديوهات تعريفية وعروض تقديمية للمستثمرين والعملاء.']],
 en:[['Visual identity & logos','Logo, colors, type and usage rules that keep your brand consistent everywhere.'],['Social media systems','Templates and a coherent Instagram grid: posts, stories and carousels ready to publish.'],['Campaigns & launches','Product campaigns, offers and launches sequenced to grab attention and drive sales.'],['Motion & presentations','2D motion Reels, explainer videos, and decks for investors and clients.']]};
const CL={ar:['فستقة','ZESTA','CityBox','OUTING','سُدرة للعطور','شارع سبعة','Quality Time','معهد ابسوس','مطعم لقمة','عيادة رواء'],en:['Fastaqa','ZESTA','CityBox','OUTING','Sudra Perfumes','Street 7','Quality Time','EPSOS Institute','Laqma Restaurant','Rawaa Clinic']};
let L='ar', F='all';
try{const s=localStorage.getItem('lv-lang'); if(s==='en'||s==='ar') L=s}catch(e){}
const $=s=>document.querySelector(s);
function render(){
  const t=T[L]; document.documentElement.lang=L; document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t; if(t[k]!==undefined){ if(el.classList.contains('vf')) el.innerHTML=t[k]+'<i></i>'; else el.textContent=t[k]; }});
  $('#lang').textContent=L==='ar'?'EN':'عربي';
  $('#filters').innerHTML=['all','social','motion'].map(k=>`<button type="button" data-f="${k}" aria-pressed="${F===k}">${t[k]}</button>`).join('');
  $('#grid').innerHTML=P.map(p=>`<button class="card" type="button" data-id="${p.id}" ${F!=='all'&&p.cat!==F?'hidden':''}><div class="img"><img src="${p.imgs[0]}.webp" alt="${p[L][0]}" loading="lazy" width="900" height="1200"></div>${p.imgs.length>1?`<span class="count">${p.imgs.length}</span>`:''}<div class="meta"><h3>${p[L][0]}</h3><div class="type">${p[L][1]}</div></div></button>`).join('');
  $('#svc').innerHTML=SVC[L].map(s=>`<div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');
  $('#clients').innerHTML=CL[L].map(c=>`<span>${c}</span>`).join('');
  $('#langs').innerHTML=t.langs.map(l=>`<div><strong>${l[0]}</strong><span>${l[1]}</span></div>`).join('');
}
$('#lang').addEventListener('click',()=>{L=L==='ar'?'en':'ar'; try{localStorage.setItem('lv-lang',L)}catch(e){} render();});
$('#filters').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; F=b.dataset.f; render();});
let last=null;
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card'); if(!c) return; last=c; const p=P.find(x=>x.id===c.dataset.id);
  $('#lbT').textContent=p[L][0]; $('#lbP').textContent=p[L][1];
  $('#lbS').innerHTML=p.imgs.map(i=>`<img src="${i}.webp" alt="${p[L][0]}">`).join('');
  $('#lb').classList.add('open'); document.body.style.overflow='hidden'; $('#lbX').focus();});
function closeLb(){ $('#lb').classList.remove('open'); document.body.style.overflow=''; if(last) last.focus(); }
$('#lbX').addEventListener('click',closeLb);
$('#lb').addEventListener('click',e=>{ if(e.target.id==='lb') closeLb(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#lb').classList.contains('open')) closeLb(); });
addEventListener('scroll',()=>$('#nav').classList.toggle('solid',scrollY>40),{passive:true});
$('#yr').textContent=new Date().getFullYear();
render();
</script>
</body>
</html>
