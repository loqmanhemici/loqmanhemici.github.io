<style>
:root{--blue:#1C35F0;--navy:#0B1440;--lime:#D6FF3D;--off:#F5F7FF;--mut:#545F82;--line:#DCE1F5;
--ar:'Alexandria','IBM Plex Sans Arabic',system-ui,sans-serif;--body:'IBM Plex Sans Arabic','Manrope',system-ui,sans-serif;--en:'Manrope','IBM Plex Sans Arabic',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:#fff;color:var(--navy);font-family:var(--body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="en"] body{font-family:var(--en)}
img,video{max-width:100%;display:block}
a{color:inherit}
.wrap{width:min(1200px,100% - 40px);margin-inline:auto}
h1,h2,h3{font-family:var(--ar);line-height:1.25;margin:0}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{font-family:var(--en)}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;border-radius:6px}

.vf{position:relative;display:inline-block;padding:.04em .26em}
.vf::before,.vf::after,.vf>i::before,.vf>i::after{content:"";position:absolute;width:.3em;height:.3em;border:.07em solid var(--lime);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.vf::before{top:0;inset-inline-start:0;border-inline-end:0;border-bottom:0}
.vf::after{top:0;inset-inline-end:0;border-inline-start:0;border-bottom:0}
.vf>i::before{bottom:0;inset-inline-start:0;border-inline-end:0;border-top:0}
.vf>i::after{bottom:0;inset-inline-end:0;border-inline-start:0;border-top:0}
.ready .hero .vf::before{animation:cTL 1.1s .2s both}.ready .hero .vf::after{animation:cTR 1.1s .2s both}
.ready .hero .vf>i::before{animation:cBL 1.1s .2s both}.ready .hero .vf>i::after{animation:cBR 1.1s .2s both}
@keyframes cTL{from{transform:translate(-30%,-30%);opacity:0}}@keyframes cTR{from{transform:translate(30%,-30%);opacity:0}}
@keyframes cBL{from{transform:translate(-30%,30%);opacity:0}}@keyframes cBR{from{transform:translate(30%,30%);opacity:0}}

/* nav */
.nav{position:fixed;inset:0 0 auto;z-index:20;padding-top:env(safe-area-inset-top,0px);transition:background .3s}
.nav.solid{background:rgba(11,20,64,.88);backdrop-filter:blur(12px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-family:var(--en);font-weight:800;font-size:18px}
.brand img{width:36px;height:36px;border-radius:50%;border:2px solid var(--lime)}
.brand b{color:var(--lime)}
.links{display:flex;gap:24px;align-items:center}
.links a{color:#DDE3FF;text-decoration:none;font-weight:600;font-size:15px}
.links a:hover{color:#fff}
.lang{border:1.5px solid var(--lime);background:transparent;color:#fff;border-radius:999px;padding:6px 16px;font-family:var(--en);font-weight:700;cursor:pointer}
@media (max-width:820px){.links a{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:140px 0 0;background:linear-gradient(180deg,#1C35F0 0%,#1529C2 55%,#0B1440 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(180deg,#000 30%,transparent 80%)}
.glow{position:absolute;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,#7B92FF 0,transparent 65%);top:-260px;inset-inline-end:-160px;opacity:.55;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.3fr .7fr;gap:48px;align-items:center}
.word{font-family:var(--en);font-weight:800;font-size:clamp(54px,10vw,132px);line-height:1;letter-spacing:-.02em;direction:ltr;margin-bottom:26px}
html[dir="rtl"] .word{text-align:right}
.word .vf{color:var(--lime)}
.hero h1{font-size:clamp(24px,3.2vw,38px);font-weight:800}
.lead{color:#DDE3FF;font-size:clamp(17px,1.6vw,20px);max-width:56ch;margin:16px 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;font-weight:700;text-decoration:none;font-size:16px;border:2px solid transparent;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--lime);color:var(--navy)}
.btn.ghost{border-color:rgba(255,255,255,.5);color:#fff}
.btn.dark{background:var(--navy);color:#fff}
.btn.line{border-color:var(--navy);color:var(--navy)}
.avatar{justify-self:center;position:relative;width:min(340px,80vw);aspect-ratio:1}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:44px;border:6px solid var(--lime);box-shadow:0 40px 80px rgba(6,10,40,.45)}
.ready .avatar img{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.avatar .tag{position:absolute;inset-block-end:-18px;inset-inline-start:-18px;background:#fff;color:var(--navy);border-radius:18px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:0 16px 40px rgba(6,10,40,.3)}
.avatar .tag b{color:var(--blue);font-family:var(--en)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:64px;padding:28px 0;border-top:1px solid rgba(255,255,255,.2)}
.stats div{color:#DDE3FF;font-size:15px}
.stats b{display:block;font-family:var(--en);font-size:clamp(34px,4vw,48px);line-height:1.1;color:#fff}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.avatar{order:-1;width:190px}.stats{grid-template-columns:repeat(2,1fr)}}
.marquee{position:relative;overflow:hidden;padding:36px 0 56px;direction:ltr}
.track{display:flex;gap:18px;width:max-content;animation:scroll 70s linear infinite}
.track img{width:170px;height:226px;object-fit:cover;border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
@keyframes scroll{to{transform:translateX(-50%)}}
.marquee:hover .track{animation-play-state:paused}

section{padding:110px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:44px;flex-wrap:wrap}
.head h2{font-size:clamp(32px,4.4vw,54px);font-weight:800}
.head p{color:var(--mut);max-width:50ch;margin:10px 0 0}
.kick{display:inline-block;font-family:var(--en);font-weight:800;font-size:14px;letter-spacing:.14em;color:var(--blue);margin-bottom:10px}

/* reveal */
.rv{opacity:0;transform:translateY(36px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* motion */
.motion{background:var(--navy);color:#fff}
.motion .head p{color:#B8C2F0}.motion .kick{color:var(--lime)}
.vids{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
@media (max-width:1000px){.vids{grid-template-columns:repeat(3,1fr)}}
@media (max-width:620px){.vids{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}.vids .vc{flex:0 0 62%;scroll-snap-align:center}}
.vc{all:unset;cursor:pointer;display:block;position:relative;border-radius:22px;overflow:hidden;aspect-ratio:9/16;background:#1a2560}
.vc video{width:100%;height:100%;object-fit:cover}
.vc .cap{position:absolute;inset:auto 0 0;padding:40px 16px 16px;background:linear-gradient(transparent,rgba(6,10,40,.9))}
.vc .cap b{display:block;font-family:var(--en);font-size:16px}
.vc .cap span{font-size:14px;color:#C9D0FF}
.vc .play{position:absolute;top:12px;inset-inline-end:12px;width:40px;height:40px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.vc:focus-visible{outline:3px solid var(--lime);outline-offset:4px}

/* work */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:8px 18px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
@media (max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{all:unset;cursor:pointer;display:block;border-radius:24px;overflow:hidden;background:var(--off);position:relative}
.card .img{aspect-ratio:3/4;overflow:hidden;background:#e9edfb}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.card:hover img{transform:scale(1.05)}
.card .meta{padding:18px 22px 22px}
.card h3{font-size:22px;font-weight:800}
.card .type{color:var(--blue);font-weight:600;font-size:15px}
.card .count{position:absolute;top:14px;inset-inline-end:14px;background:var(--navy);color:#fff;font-family:var(--en);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px}
.card .vtag{position:absolute;top:14px;inset-inline-start:14px;background:var(--lime);color:var(--navy);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px}
.card[hidden]{display:none}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:4px}

/* services */
.services{background:var(--off)}
.svc{display:grid;grid-template-columns:repeat(2,1fr);border-top:2px solid var(--navy)}
.svc div{padding:30px 0;border-bottom:1px solid var(--line)}
.svc div:nth-child(odd){padding-inline-end:40px}
.svc div:nth-child(even){padding-inline-start:40px;border-inline-start:1px solid var(--line)}
.svc h3{font-size:24px;font-weight:800;margin-bottom:6px;display:flex;gap:12px;align-items:baseline}
.svc h3 small{font-family:var(--en);color:var(--blue);font-size:15px}
.svc p{margin:0;color:var(--mut)}
@media (max-width:700px){.svc{grid-template-columns:1fr}.svc div:nth-child(n){padding-inline:0;border-inline-start:0}}

/* about */
.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:64px}
@media (max-width:860px){.about .wrap{grid-template-columns:1fr}}
.bio{font-size:19px;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 28px}
.chips span{border-radius:12px;padding:8px 16px;font-family:var(--en);font-weight:700;font-size:15px;background:var(--navy);color:#fff}
.chips.ai span{background:var(--lime);color:var(--navy)}
.about h3{font-size:18px;color:var(--blue);font-weight:700}
.langs div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.langs span{color:var(--mut)}
.clients{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 28px}
.clients span{border:1.5px solid var(--blue);border-radius:999px;padding:6px 16px;font-weight:600}

/* contact */
.contact{background:linear-gradient(180deg,#1C35F0,#0B1440);color:#fff;text-align:center}
.contact h2{font-size:clamp(34px,5vw,64px);font-weight:800}
.contact h2 .vf{color:var(--lime)}
.contact p{color:#DDE3FF;margin:16px auto 34px;max-width:52ch}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px;text-align:start}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.cards{grid-template-columns:1fr}}
.cards a{display:block;text-decoration:none;padding:20px 22px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);transition:background .2s}
.cards a:hover{background:rgba(255,255,255,.15)}
.cards small{display:block;color:var(--lime);font-family:var(--en);font-weight:700;font-size:13px}
.cards strong{font-family:var(--en);font-size:17px;word-break:break-all;direction:ltr;unicode-bidi:isolate}
footer{background:var(--navy);color:#9AA6D8;text-align:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));font-size:14px;border-top:1px solid rgba(255,255,255,.08)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(6,10,40,.95);display:none;flex-direction:column}
.lb.open{display:flex}
.lb header{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 24px 12px;color:#fff;gap:16px}
.lb header h3{font-size:20px}
.lb header p{margin:0;color:#B8C2F0;font-size:15px}
.lb .x{background:var(--lime);color:var(--navy);border:0;border-radius:999px;width:44px;height:44px;font-size:22px;font-weight:800;cursor:pointer;flex:none}
.lb .strip{flex:1;display:flex;gap:20px;overflow-x:auto;padding:8px 24px calc(24px + env(safe-area-inset-bottom,0px));scroll-snap-type:x mandatory;align-items:center}
.lb .strip img,.lb .strip video{height:min(80vh,920px);width:auto;max-width:90vw;object-fit:contain;border-radius:16px;scroll-snap-align:center;flex:none;background:#111a4d}
.lb .hint{color:#8C98D0;font-size:13px;text-align:center;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>

let L='ar',F='all';

const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function render(){
  const t=T[L];document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>{const v=t[el.dataset.t];if(v===undefined)return;if(el.classList.contains('vf'))el.innerHTML=v+'<i></i>';else el.textContent=v;});
  $('#lang').textContent=L==='ar'?'EN':'عربي';
  $('#filters').innerHTML=['all','social','brand','ai'].map(k=>`<button type="button" data-f="${k}" aria-pressed="${F===k}">${t[k]}</button>`).join('');
  $('#grid').innerHTML=P.map(p=>`<button class="card rv" type="button" data-id="${p.id}" ${F!=='all'&&p.cat!==F?'hidden':''}><div class="img"><img src="${p.imgs[0]}" alt="${p[L][0]}" loading="lazy"></div>${p.video?`<span class="vtag">▶ ${t.video}</span>`:''}<span class="count">${p.imgs.length} ${t.designs}</span><div class="meta"><h3>${p[L][0]}</h3><div class="type">${p[L][1]}</div></div></button>`).join('');
  $('#vids').innerHTML=V.map(v=>`<button class="vc rv" type="button" data-v="${v.id}" aria-label="${v[L][0]} – ${v[L][1]}"><video src="v-${v.id}.mp4" poster="p-${v.id}.webp" muted loop playsinline preload="none"></video><span class="play" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="#0B1440"/></svg></span><span class="cap"><b>${v[L][0]}</b><span>${v[L][1]}</span></span></button>`).join('');
  $('#svc').innerHTML=t.svc.map((s,i)=>`<div><h3><small>0${i+1}</small>${s[0]}</h3><p>${s[1]}</p></div>`).join('');
  const cl=[...new Set(P.filter(p=>p.id!=='logos').map(p=>p[L][0]))];
  $('#clients').innerHTML=cl.map(c=>`<span>${c}</span>`).join('');
  $('#langs').innerHTML=t.langs.map(l=>`<div><strong>${l[0]}</strong><span>${l[1]}</span></div>`).join('');
  observe();
}

// reveal + autoplay
let io,vio;
function observe(){
  if(io)io.disconnect(); if(vio)vio.disconnect();
  const els=document.querySelectorAll('.rv');
  if(reduce||!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));}
  else{io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const el=e.target;const sib=[...el.parentElement.children].filter(c=>c.classList.contains('rv'));el.style.transitionDelay=Math.min(sib.indexOf(el)%3*0.12,0.36)+'s';el.classList.add('in');io.unobserve(el);}}),{threshold:.12});els.forEach(e=>io.observe(e));}
  if(!reduce&&'IntersectionObserver' in window){vio=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){v.preload='auto';v.play().catch(()=>{});}else v.pause();}),{threshold:.5});document.querySelectorAll('.vc video').forEach(v=>vio.observe(v));}
}
// counters
function count(){const bs=document.querySelectorAll('#stats b');const run=b=>{const to=+b.dataset.to,plus=b.hasAttribute('data-plus');if(reduce){b.textContent=to+(plus?'+':'');return}const t0=performance.now(),d=1600;(function step(n){const k=Math.min((n-t0)/d,1),e=1-Math.pow(1-k,3);b.textContent=Math.round(to*e)+(plus&&k===1?'+':'');if(k<1)requestAnimationFrame(step);})(t0);};
  if(!('IntersectionObserver' in window)){bs.forEach(run);return}
  const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){run(e.target);o.unobserve(e.target);}}),{threshold:.6});bs.forEach(b=>o.observe(b));}

function closeLb(){$('#lbS').querySelectorAll('video').forEach(v=>v.pause());$('#lbS').innerHTML='';$('#lb').classList.remove('open');document.body.style.overflow='';if(last)last.focus();observe();}
